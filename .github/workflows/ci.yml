name: CI

on:
  push:
  pull_request:

jobs:
  portable:
    name: Linux (core + CLI + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Demo (any version is supported)
        run: |
          python3 tools/make_fake_client.py --dir examples/demo/client --version 3.3.5.12340
          ./build/wowmod validate --config examples/demo/wowmod.json
          ./build/wowmod plan --config examples/demo/wowmod.json
          ./build/wowmod scan --config examples/demo/wowmod.json
          python3 tools/make_fake_client.py --dir examples/demo/client --version 12.1.5.70783
          ./build/wowmod detect --config examples/demo/wowmod.json --json | grep -q '"supported": true'
      - name: Cross-compile Windows sources with zig
        run: |
          python3 -m pip install --quiet ziglang
          chmod +x scripts/verify-windows.sh
          ./scripts/verify-windows.sh

  windows:
    name: Windows (MSVC binaries)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release
      - name: Portable tests on Windows too
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: wowmod-windows-x64
          path: |
            build/Release/wowmod.exe
            build/Release/wowmod_hook.dll
